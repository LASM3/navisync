[package]
name = "navisync"
version = "0.0.1"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.0+spec-1.1.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rpassword = "7"
clap = { version = "4", features = ["derive"] }
base64 = "0.23.1"
url = "2.5.8"
